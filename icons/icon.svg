<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Piratify">
  <!-- White tile, ink mark. One colour, no gradient to drift, and nothing to
       clash with the covers it sits beside. -->
  <rect width="512" height="512" rx="140" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="138.5" fill="none" stroke="#111114" stroke-opacity="0.10" stroke-width="3"/>

  <!-- The mark, the same 32-unit geometry index.html carries as #i-logo, scaled
       and centred on the tile. Reference art is bottom-left of home-screen
       icons, so the vector is inset rather than filling the square. -->
  <g transform="translate(256 256) scale(13.2) translate(-16.065 -15.88)" fill="#111114">
    <path d="M5.5 2.2H28.9L24.1 9.1 28.9 16H5.5Z"/>
    <rect x="5.5" y="2.2" width="2.6" height="23.4" rx="1.3"/>
    <ellipse cx="8.9" cy="24.9" rx="5.5" ry="4.3" transform="rotate(-20 8.9 24.9)"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round">
      <path d="M11.9 13.7 21.1 4.5"/>
      <path d="M11.9 4.5 21.1 13.7"/>
    </g>
    <circle cx="16.5" cy="9.1" r="4.1" fill="#ffffff"/>
    <rect x="14.4" y="11.2" width="4.2" height="2.6" rx="1.25" fill="#ffffff"/>
    <circle cx="15" cy="8.6" r="1.05"/>
    <circle cx="18" cy="8.6" r="1.05"/>
  </g>
</svg>
