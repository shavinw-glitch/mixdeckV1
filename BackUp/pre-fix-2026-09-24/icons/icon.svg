<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Wavefy">
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111114" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- White tile, ink mark. The logo is one colour: no gradient to drift, and
       nothing to clash with the covers it sits beside. -->
  <rect width="512" height="512" rx="140" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="138.5" fill="none" stroke="#111114" stroke-opacity="0.10" stroke-width="3"/>

  <!-- The mark: four bars, the same geometry index.html carries as #i-logo —
       32 units scaled by 16, sharing a baseline at y = 27 (432 here). -->
  <g fill="#111114" transform="scale(16)">
    <rect x="3.9"  y="11" width="4.4" height="16" rx="2.2"/>
    <rect x="10.5" y="5"  width="4.4" height="22" rx="2.2"/>
    <rect x="17.1" y="15" width="4.4" height="12" rx="2.2"/>
    <rect x="23.7" y="8"  width="4.4" height="19" rx="2.2"/>
  </g>
</svg>
